server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to tenant-gateway (avoids CORS in Docker)
    location /v1/ {
        proxy_pass ${GATEWAY_URL:-http://tenant-gateway:8090};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass ${HONEYCOMB_URL:-http://hive-control-plane:8080};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
}
